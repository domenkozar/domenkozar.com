{{ if gt .TotalPages 1 }}
  <nav class="Pagination" role="navigation" aria-label="Pagination">
    {{ with .Prev }}<a class="Pagination-newer" href="{{ .URL }}"><span aria-hidden="true">←</span> Newer</a>{{ else }}<span></span>{{ end }}
    <span class="Pagination-number">Page {{ .PageNumber }} of {{ .TotalPages }}</span>
    {{ with .Next }}<a class="Pagination-older" href="{{ .URL }}">Older <span aria-hidden="true">→</span></a>{{ else }}<span></span>{{ end }}
  </nav>
{{ end }}

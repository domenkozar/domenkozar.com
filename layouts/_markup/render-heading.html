{{- $hasLink := strings.Contains (printf "%s" .Text) "<a " -}}
<h{{ .Level }} id="{{ .Anchor }}"{{ with .Attributes.class }} class="{{ . }}"{{ end }}>
  {{- if $hasLink -}}
    {{- .Text -}}
    <a class="Heading-permalink Heading-permalink--hash" href="#{{ .Anchor }}" aria-label="Link to this section: {{ .PlainText }}"></a>
  {{- else -}}
    <a class="Heading-permalink" href="#{{ .Anchor }}">{{- .Text -}}</a>
  {{- end -}}
</h{{ .Level }}>
